services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"  # Expose PostgreSQL to host for local development
    environment:
      - POSTGRES_USER=safepsy_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-safepsy_dev_password}
      - POSTGRES_DB=safepsy_dev
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safepsy_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spglobalv1-network

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spglobalv1-network

networks:
  spglobalv1-network:
    driver: bridge

volumes:
  postgres_dev_data:
    driver: local
  qdrant_storage:
    driver: local




