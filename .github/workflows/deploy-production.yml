# Production Deployment Workflow
# Validated path: deploy-live-app.sh → scw-last-app (151.115.151.231), Scaleway direct.
# See deployment/DEPLOY-RUNBOOK.md
#
# Requires GitHub secrets:
#   SSH_PRIVATE_KEY — root access to scw-last-app
#   SCALEWAY_API_KEY — Generative API (backend proxy)
# Optional: DATABASE_PASSWORD (legacy CI steps)
#
# Trigger: Actions → Deploy Production → Run workflow
name: Deploy Production

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    env:
      APP_IP: "151.115.151.231"
      APP_DOMAIN: "polinapsycho.com"
      USE_SCALEWAY_DIRECT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CI disk guard (stricter than production)
        uses: ./.github/actions/ci-disk-guard

      - name: Setup SSH
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "::error::SSH_PRIVATE_KEY secret is not set."
            exit 1
          fi
          if [ -z "${{ secrets.SCALEWAY_API_KEY }}" ]; then
            echo "::error::SCALEWAY_API_KEY secret is not set (required for USE_SCALEWAY_DIRECT=1)."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${APP_IP}" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH_KEY=${HOME}/.ssh/id_ed25519" >> $GITHUB_ENV

      - name: Deploy (Scaleway direct app stack)
        env:
          SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
          SKIP_PREFLIGHT_GIT: "1"
          SSH_BOOT_WAIT_SEC: "180"
        run: |
          chmod +x deployment/deploy-live-app.sh deployment/deploy.sh deployment/deploy-app.sh
          ./deployment/deploy-live-app.sh

      - name: Verify deployment
        env:
          SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
        run: |
          sleep 20
          chmod +x deployment/verify-production.sh
          CHECK_LLM=1 USE_SCALEWAY_DIRECT=1 APP_IP="${APP_IP}" \
            ./deployment/verify-production.sh || echo "::warning::Verify failed — check logs on host"
