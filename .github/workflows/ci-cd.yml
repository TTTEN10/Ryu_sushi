name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  TERRAFORM_VERSION: '1.5.7'

jobs:
  # Terraform Validation
  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra/terraform
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
        continue-on-error: true  # Allow plan to fail if credentials aren't set

  # Application Tests
  application-tests:
    name: Application Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        app: [web, api]
    
    defaults:
      run:
        working-directory: ./apps/${{ matrix.app }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd ../..
          npm ci

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build

  # Root Level Tests
  root-tests:
    name: Root Level Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Type Check (Root)
        run: npm run typecheck
        continue-on-error: true

      - name: Lint (Root)
        run: npm run lint
        continue-on-error: true

      - name: Security Audit
        run: npm audit --workspaces --audit-level=moderate
        continue-on-error: true

      - name: Build All
        run: npm run build
        continue-on-error: true

  # Docker Validation
  docker-validation:
    name: Docker Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose files
        run: |
          # Repo may not include root docker-compose.*.yml files.
          # Skip validation when they are absent.
          if [ ! -f docker-compose.dev.yml ] && [ ! -f docker-compose.prod.yml ] && [ ! -f docker-compose.observability.yml ]; then
            echo "No docker-compose.*.yml found at repo root; skipping Docker Compose validation."
            exit 0
          fi
          if [ -f docker-compose.dev.yml ]; then docker-compose -f docker-compose.dev.yml config > /dev/null; fi
          if [ -f docker-compose.prod.yml ]; then docker-compose -f docker-compose.prod.yml config > /dev/null; fi
          if [ -f docker-compose.observability.yml ]; then docker-compose -f docker-compose.observability.yml config > /dev/null; fi

      - name: Validate Dockerfile syntax
        run: |
          # Basic Dockerfile validation; skip when repo doesn't include one at root.
          if [ ! -f Dockerfile ]; then
            echo "No root Dockerfile found; skipping Dockerfile validation."
            exit 0
          fi
          if ! grep -q "^FROM" Dockerfile; then
            echo "Error: Dockerfile missing FROM instruction"
            exit 1
          fi

  # Deployment Validation (Terraform Plan with credentials)
  terraform-plan:
    name: Terraform Deployment Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./infra/terraform
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
        continue-on-error: true

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/tfplan', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Terraform Plan\n\n```\n' + plan + '\n```'
            });

  # Summary Job
  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [terraform-validation, application-tests, root-tests, docker-validation]
    if: always()
    
    steps:
      - name: Check Job Status
        run: |
          echo "Terraform Validation: ${{ needs.terraform-validation.result }}"
          echo "Application Tests: ${{ needs.application-tests.result }}"
          echo "Root Tests: ${{ needs.root-tests.result }}"
          echo "Docker Validation: ${{ needs.docker-validation.result }}"
          
          if [ "${{ needs.terraform-validation.result }}" == "failure" ] || \
             [ "${{ needs.application-tests.result }}" == "failure" ] || \
             [ "${{ needs.root-tests.result }}" == "failure" ] || \
             [ "${{ needs.docker-validation.result }}" == "failure" ]; then
            echo "❌ Some validation steps failed"
            exit 1
          else
            echo "✅ All validation steps passed"
          fi

