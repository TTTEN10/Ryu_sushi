services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: safepsy_dev
      POSTGRES_USER: safepsy_user
      POSTGRES_PASSWORD: safepsy_dev_password
    ports:
      - "5432:5432"
    volumes:
      - safepsy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safepsy_user -d safepsy_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - safepsy_redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional: Qdrant for RAG indexing/search (the app defaults to http://localhost:6333)
  qdrant:
    image: qdrant/qdrant:v1.13.4
    profiles: ["rag"]
    ports:
      - "6333:6333"
    volumes:
      - safepsy_qdrantdata:/qdrant/storage

volumes:
  safepsy_pgdata:
  safepsy_redisdata:
  safepsy_qdrantdata:

