version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=safepsy_user
      - POSTGRES_PASSWORD=ceCS4EeuS3owaoFnAZYPvyLg6BrxvOYeeNTFzYed5EU=
      - POSTGRES_DB=safepsy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safepsy_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spglobalv1-network

  spglobalv1-landing:
    build:
      context: .
      dockerfile: Dockerfile.slim
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://safepsy_user:ceCS4EeuS3owaoFnAZYPvyLg6BrxvOYeeNTFzYed5EU%3D@postgres:5432/safepsy
      - FRONTEND_URL=${FRONTEND_URL:-https://safepsy.com}
      - IP_SALT=${IP_SALT:-}
      - IP_HASHING_ENABLED=${IP_HASHING_ENABLED:-false}
      - PLAUSIBLE_DOMAIN=${PLAUSIBLE_DOMAIN:-safepsy.com}
      - ENABLE_CONFIRMATION_EMAIL=${ENABLE_CONFIRMATION_EMAIL:-false}
      - SCALEWAY_API_KEY=${SCALEWAY_API_KEY:-}
      - AI_GPU_BASE_URL=http://host.docker.internal:8000
      - AI_INTERNAL_API_KEY=${AI_INTERNAL_API_KEY:-3f1908c51671a74921344ea40df1144118499d01d4d7138fd2c7ac2ac0c63e64}
    volumes:
      - ./logs:/app/logs
      - frontend_files:/app/apps/web/dist
      - ./prisma/schema.prisma:/app/prisma/schema.prisma:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/healthz', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - spglobalv1-network

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - frontend_files:/app/apps/web/dist
    depends_on:
      - spglobalv1-landing
    restart: unless-stopped
    networks:
      - spglobalv1-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  spglobalv1-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  frontend_files:
    driver: local
